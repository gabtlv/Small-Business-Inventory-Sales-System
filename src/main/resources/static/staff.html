<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Staff | Inventory System</title>
    <link rel="stylesheet" href="/css/styles.css">
</head>
<body>
    <header class="topbar">
        <a href="/index.html"><strong>Inventory System</strong></a>
        <span id="who" class="muted"></span>
        <form method="post" action="/logout"><button class="link">Log out</button></form>
    </header>

    <main class="container">
        <!-- Sprint 3: staff management. Admin only (SecurityConfig). Data: /api/users -->
        <h1>Staff</h1>

        <p id="message" class="alert" role="status" hidden></p>

        <form id="staff-form" class="inline-form">
            <div class="grow">
                <label for="new-username">Username</label>
                <input id="new-username" maxlength="50" autocomplete="off" required>
            </div>
            <div class="grow">
                <label for="new-password">Password</label>
                <input id="new-password" type="password" minlength="6" maxlength="72" autocomplete="new-password" required>
            </div>
            <button type="submit">Add staff</button>
        </form>
        <p class="muted small">New accounts are Staff (cashier) accounts. Passwords need at least 6 characters.</p>

        <p id="loading" class="muted">Loading staff…</p>
        <p id="no-staff" class="muted" hidden>No staff accounts yet.</p>
        <table id="staff-table" hidden>
            <thead>
                <tr><th>Username</th><th><span class="visually-hidden">Actions</span></th></tr>
            </thead>
            <tbody id="staff-rows"></tbody>
        </table>
        <p class="muted small">Removing an account signs that person out and stops them logging in. Their past sales are kept.</p>
    </main>

    <script src="/js/app.js"></script>
    <script src="/js/staff.js"></script>
</body>
</html>
