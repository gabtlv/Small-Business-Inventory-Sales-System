<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Home | Inventory System</title>
    <link rel="stylesheet" href="/css/styles.css">
</head>
<body>
    <header class="topbar">
        <strong>Inventory System</strong>
        <span id="who" class="muted"></span>
        <form method="post" action="/logout"><button class="link">Log out</button></form>
    </header>

    <main class="container">
        <h1>Home</h1>
        <p>Welcome, <span id="username"></span>. You are logged in as <strong id="role"></strong>.</p>

        <!-- Story 6: low-stock alerts (Admin only; data comes from GET /api/products/low-stock) -->
        <section id="low-stock" class="alert warning low-stock-panel" data-admin-only hidden>
            <strong id="low-stock-title"></strong>
            <ul id="low-stock-list"></ul>
            <a href="/products.html">Go to products</a>
        </section>

        <div class="tiles">
            <a class="tile" href="/products.html">
                <strong>Products</strong>
                <span class="muted">View inventory</span>
            </a>
            <!-- data-admin-only: hidden for Staff by app.js -->
            <a class="tile" href="/product-form.html" data-admin-only>
                <strong>Add product</strong>
                <span class="muted">Admin only</span>
            </a>
            <a class="tile" href="/checkout.html">
                <strong>Checkout</strong>
                <span class="muted">Record a sale</span>
            </a>
            <a class="tile" href="/reports.html" data-admin-only>
                <strong>Sales report</strong>
                <span class="muted">Daily, weekly, monthly</span>
            </a>
        </div>
    </main>

    <script src="/js/app.js"></script>
    <script>
        loadCurrentUser().then(me => {
            document.getElementById("username").textContent = me.username;
            document.getElementById("role").textContent = me.role;
            document.getElementById("who").textContent = me.username + " (" + me.role + ")";
            if (me.role === "ADMIN") loadLowStock();
        });

        /** Story 6: show which products need reordering. */
        async function loadLowStock() {
            const panel = document.getElementById("low-stock");
            try {
                const low = await api("/api/products/low-stock");
                if (low.length === 0) return;
                document.getElementById("low-stock-title").textContent =
                    `${low.length} product${low.length === 1 ? " is" : "s are"} low on stock. Time to reorder:`;
                document.getElementById("low-stock-list").replaceChildren(...low.map(p => {
                    const li = document.createElement("li");
                    li.textContent = `${p.name}${p.sku ? " (" + p.sku + ")" : ""}: ` +
                        (p.quantity === 0 ? "out of stock" : `${p.quantity} left`) +
                        ` (alert at ${p.lowStockThreshold})`;
                    return li;
                }));
                panel.hidden = false;
            } catch (e) {
                document.getElementById("low-stock-title").textContent = "Couldn't check stock levels: " + e.message;
                document.getElementById("low-stock-list").replaceChildren();
                panel.hidden = false;
            }
        }
    </script>
</body>
</html>
