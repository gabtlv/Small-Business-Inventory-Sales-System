<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Home | Inventory System</title>
    <link rel="stylesheet" href="/css/styles.css">
</head>
<body>
    <header class="topbar">
        <strong>Inventory System</strong>
        <span id="who" class="muted"></span>
        <form method="post" action="/logout"><button class="link">Log out</button></form>
    </header>

    <main class="container">
        <h1>Home</h1>
        <p>Welcome, <span id="username"></span>. You are logged in as <strong id="role"></strong>.</p>

        <div class="tiles">
            <a class="tile" href="/products.html">
                <strong>Products</strong>
                <span class="muted">View inventory</span>
            </a>
            <!-- data-admin-only: hidden for Staff by app.js -->
            <a class="tile" href="/product-form.html" data-admin-only>
                <strong>Add product</strong>
                <span class="muted">Admin only</span>
            </a>
            <a class="tile" href="/checkout.html">
                <strong>Checkout</strong>
                <span class="muted">Record a sale</span>
            </a>
        </div>
    </main>

    <script src="/js/app.js"></script>
    <script>
        loadCurrentUser().then(me => {
            document.getElementById("username").textContent = me.username;
            document.getElementById("role").textContent = me.role;
            document.getElementById("who").textContent = me.username + " (" + me.role + ")";
        });
    </script>
</body>
</html>
