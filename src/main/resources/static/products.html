<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Products | Inventory System</title>
    <link rel="stylesheet" href="/css/styles.css">
</head>
<body>
    <header class="topbar">
        <a href="/index.html"><strong>Inventory System</strong></a>
        <span id="who" class="muted"></span>
        <form method="post" action="/logout"><button class="link">Log out</button></form>
    </header>

    <main class="container">
        <div class="page-head">
            <h1>Products</h1>
            <a class="button" href="/product-form.html" data-admin-only>+ Add product</a>
        </div>

        <p id="message" class="alert" role="status" hidden></p>

        <!-- Story 9: search by name or SKU. Story 8: filter by category. -->
        <div class="filters">
            <div class="grow">
                <label for="search">Search by name or SKU</label>
                <input id="search" type="search" placeholder="e.g. mug or SKU-1001" autocomplete="off">
            </div>
            <div>
                <label for="category-filter">Category</label>
                <select id="category-filter">
                    <option value="">All categories</option>
                </select>
            </div>
        </div>

        <p id="result-count" class="muted" aria-live="polite"></p>

        <div class="table-scroll">
            <table>
                <thead>
                    <tr>
                        <th>Name</th>
                        <th>SKU</th>
                        <th>Category</th>
                        <th class="num">Price</th>
                        <th class="num">Quantity</th>
                        <th data-admin-only><span class="visually-hidden">Actions</span></th>
                    </tr>
                </thead>
                <tbody id="rows"></tbody>
            </table>
        </div>
        <p id="empty" class="muted" hidden></p>

        <!-- Story 8: Admin manages the category list -->
        <section class="card section" data-admin-only>
            <h2>Categories</h2>
            <form id="category-form" class="inline-form">
                <div class="grow">
                    <label for="category-name">New category</label>
                    <input id="category-name" maxlength="100" placeholder="e.g. Drinkware" required>
                </div>
                <button type="submit">Add category</button>
            </form>
            <ul id="category-list" class="chip-list"></ul>
            <p class="muted small">Deleting a category keeps its products; they just become uncategorized.</p>
        </section>
    </main>

    <script src="/js/app.js"></script>
    <script src="/js/products.js"></script>
</body>
</html>
