spring.application.name=inventory

# Port 8080 is taken by a Windows service on some machines, so we use 8081
server.port=8081

# ---- Database (MySQL) ----
# Defaults assume a local MySQL with a database called `inventory`.
# Put YOUR password in application-local.properties (project root, git-ignored), e.g.
#   spring.datasource.password=yourMySqlPassword
spring.config.import=optional:file:./application-local.properties
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/inventory}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:}

# Tables are created by schema.sql (not by Hibernate), every startup, safely (IF NOT EXISTS)
spring.sql.init.mode=always
spring.jpa.hibernate.ddl-auto=none
spring.jpa.open-in-view=false
