# Runs the test suite on GitHub's servers so a broken build shows up as a red X on the commit or PR.
#   - every push to main
#   - every pull request, whatever branch it targets (sprint work goes feature branch -> feature branch -> main)
name: CI

on:
  push:
    branches: [main]
  pull_request:

# A newer push to the same PR cancels the run that's still going for the older commit
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: mvnw test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read

    steps:
      - name: Check out the code
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven            # reuse downloaded dependencies between runs

      - name: Run tests
        # Tests use an in-memory H2 database, so no MySQL is needed here
        run: |
          chmod +x mvnw
          ./mvnw -B test

      - name: Upload test reports if something failed
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: surefire-reports
          path: target/surefire-reports/
          retention-days: 7
